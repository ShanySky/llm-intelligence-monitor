      要求所有 12 项之和恰好为 23，并且任意相邻两项不能相等。
      满足条件的序列共有多少个？只输出整数。
  assert:
    - type: equals
      value: "1198"

- description: S02-EN-constrained-sequences
  vars:
    pair_id: S02
    language: en
    category: stress
    question: >-
      Consider length-12 sequences whose entries are only 1, 2, or 3.
