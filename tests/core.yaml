- description: U07-ZH-postgresql-window-composition
  vars:
    pair_id: U07
    language: zh
    category: ultra
    question: >-
      PostgreSQL 表 t(grp,id,val) 包含：
      ('A',1,7),('A',2,12),('A',3,12),('A',4,5),('A',5,9),
      ('B',1,10),('B',2,3),('B',3,10),('B',4,8),('B',5,6),
      ('C',1,4),('C',2,11),('C',3,2),('C',4,11),('C',5,7)。
      执行：
      WITH x AS (
        SELECT grp,id,val,
               dense_rank() OVER (PARTITION BY grp ORDER BY val DESC) AS r,
               lag(val,1,0) OVER (PARTITION BY grp ORDER BY id) AS prev
        FROM t
      )
      SELECT sum((val+prev)*r)
      FROM x
      WHERE r<=3 AND (id+r)%2=0;
      只输出最终整数。
  assert:
    - type: equals
      value: "158"

