- description: U06-ZH-python-generator-closure
  vars:
    pair_id: U06
    language: zh
    category: ultra
    question: >-
      Python 3 中执行：
      def outer():
          x=[1,2]
          def gen():
              for i in range(3):
                  x.append(x[-1]+i)
                  yield (lambda j=i: x[j]+x[-1])
          return gen(),x
      g,x=outer()
      fs=list(g)
      x[0]=10
      print([f() for f in fs],x)
      严格输出 print 打印的内容，不要解释。
  assert:
    - type: equals
      value: "[15, 7, 7] [10, 2, 2, 3, 5]"

