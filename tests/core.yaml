      A,A,A,B,B,B,C,C,D,D. No equal letters may be adjacent; the first
      character may not be C; the last character may not be D; and the
      adjacent substring "AB" must occur exactly once in the entire string.
      How many distinct strings satisfy all conditions? Output only the integer.
