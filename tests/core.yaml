      用多重集合 A,A,A,B,B,B,C,C,D,D 的全部 10 个字母组成长度为 10 的字符串。
      要求：任意两个相同字母都不相邻；首字符不能是 C；末字符不能是 D；
      相邻子串 "AB" 在整个字符串中恰好出现 1 次。
      一共有多少个不同字符串？只输出整数。
  assert:
