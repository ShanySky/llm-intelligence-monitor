      A与H不能同时选，B与J不能同时选。
      目标依次为：最大化 effective 总和；若并列最小化 risk 总和；
      若仍并列取编号字典序最小的集合。
      严格输出“编号列表|effective总和|cost总和|risk总和”，编号升序且用英文逗号连接。
