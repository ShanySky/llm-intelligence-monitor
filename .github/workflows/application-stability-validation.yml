name: Application discriminator stability validation

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: application-discriminator-stability
  cancel-in-progress: false

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-app-stability]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: [1, 2]
        config:
          - key: gpt-6-astra-xhigh
            model: gpt-6-astra
            effort: xhigh
          - key: gpt-6-1-sol-medium
            model: gpt-6.1-sol
            effort: medium
          - key: gpt-6-1-sol-high
            model: gpt-6.1-sol
            effort: high
          - key: gpt-6-1-sol-xhigh
            model: gpt-6.1-sol
            effort: xhigh

    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare hard-review
        shell: bash
        run: |
          TASK_DIR="/tmp/stability-hard-review-${{ matrix.config.key }}-${{ matrix.trial }}"
          rm -rf "$TASK_DIR"
          mkdir -p "$TASK_DIR"
          cp -R benchmarks/hard-review/workspace/. "$TASK_DIR/"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run lightweight agent
        id: agent
        shell: bash
        run: |
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "${{ matrix.config.model }}"             "${{ matrix.config.effort }}"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py hard-review "$TASK_DIR" "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"light-agent-result.json"
          runner=json.loads(rp.read_text()) if rp.exists() else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          if infra:
              outcome="infrastructure_error"
          elif exit_code==0:
              outcome="completed"
          elif exit_code==124:
              outcome="model_timeout"
          else:
              outcome="runner_error"
          result={
            "task":"hard-review",
            "trial":int("${{ matrix.trial }}"),
            "model":"${{ matrix.config.model }}",
            "effort":"${{ matrix.config.effort }}",
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "shell_commands":runner.get("shell_commands",0),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/light-agent-result.json")
          p=root/"REVIEW.md"
          if p.exists(): shutil.copy2(p,"result/REVIEW.md")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-stability-hard-review-${{ matrix.config.key }}-t${{ matrix.trial }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: eval
    if: always() && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load final validation baseline
        shell: bash
        run: |
          mkdir -p results
          git fetch origin application-final-results || true
          git show origin/application-final-results:application-final/latest.json > results/application-final-baseline.json 2>/dev/null || true

      - uses: actions/download-artifact@v4
        with:
          pattern: app-stability-*-${{ github.run_id }}
          path: results/application-stability

      - name: Summarize stability
        shell: bash
        run: |
          node scripts/summarize-application-stability.mjs             results/application-stability             results/application-final-baseline.json             hard-review             results/application-stability-summary.json             results/application-stability-summary.md
          cat results/application-stability-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: application-stability-summary-${{ github.run_id }}
          path: |
            results/application-stability-summary.json
            results/application-stability-summary.md
          retention-days: 60

      - name: Publish latest stability validation
        shell: bash
        run: |
          cp results/application-stability-summary.md /tmp/application-stability-latest.md
          cp results/application-stability-summary.json /tmp/application-stability-latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin application-stability-results || true
          if git show-ref --verify --quiet refs/remotes/origin/application-stability-results; then
            git switch -C application-stability-results origin/application-stability-results
          else
            git switch --orphan application-stability-results
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p application-stability/runs
          cp /tmp/application-stability-latest.md application-stability/latest.md
          cp /tmp/application-stability-latest.json application-stability/latest.json
          cp /tmp/application-stability-latest.md "application-stability/runs/${GITHUB_RUN_ID}.md"
          cp /tmp/application-stability-latest.json "application-stability/runs/${GITHUB_RUN_ID}.json"

          git add application-stability
          if ! git diff --cached --quiet; then
            git commit -m "Record application stability validation ${GITHUB_RUN_ID}"
            git push origin HEAD:application-stability-results
          fi
