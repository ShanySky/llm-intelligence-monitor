name: LLM intelligence smoke test

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Fresh repetitions per test/model (use 1 for smoke run, 3 for baseline runs)
        required: true
        default: "1"
  schedule:
    - cron: "30 9 * * *"
      timezone: "America/New_York"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  eval:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Choose repeat count
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "EVAL_REPEAT=3" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EVAL_REPEAT=${{ inputs.repeat }}" >> "$GITHUB_ENV"
          else
            echo "EVAL_REPEAT=1" >> "$GITHUB_ENV"
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing repository secret: OPENAI_API_KEY"; exit 1; }
          test -n "$OPENAI_BASE_URL" || { echo "Missing repository secret: OPENAI_BASE_URL"; exit 1; }

      - name: Run Promptfoo
        id: promptfoo
        shell: bash
        run: |
          mkdir -p results
          set +e
          npx -y promptfoo@0.123.1 eval \
            -c promptfooconfig.yaml \
            --no-cache \
            --no-share \
            --repeat "$EVAL_REPEAT" \
            --max-concurrency 2 \
            -o results/results.json \
            -o results/results.html
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          # Assertion failures are monitoring data, not infrastructure failures.
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then
            exit "$status"
          fi

      - name: Build compact summary
        if: always()
        shell: bash
        run: |
          if [ -f results/results.json ]; then
            node scripts/summarize.mjs results/results.json results/summary.json results/summary.md
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Promptfoo did not produce results/results.json." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-intelligence-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
