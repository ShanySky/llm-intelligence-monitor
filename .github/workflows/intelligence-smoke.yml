name: LLM intelligence daily monitor

on:
  workflow_dispatch:
    inputs:
      anchor_count:
        description: Optional fixed-anchor count override; blank uses monitor-config.json
        required: false
        default: ""
      rotating_count:
        description: Optional rotating-question count override; blank uses monitor-config.json
        required: false
        default: ""
      repeat:
        description: Optional repeat override; blank uses monitor-config.json
        required: false
        default: ""
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  eval:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate required secrets
        shell: bash
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing repository secret: OPENAI_API_KEY"; exit 1; }
          test -n "$OPENAI_BASE_URL" || { echo "Missing repository secret: OPENAI_BASE_URL"; exit 1; }
          test -n "$MAIL_USERNAME" || { echo "Missing repository secret: MAIL_USERNAME"; exit 1; }
          test -n "$MAIL_PASSWORD" || { echo "Missing repository secret: MAIL_PASSWORD"; exit 1; }
          test -n "$MAIL_TO" || { echo "Missing repository secret: MAIL_TO"; exit 1; }

      - name: Select balanced daily questions
        shell: bash
        env:
          ANCHOR_COUNT_OVERRIDE: ${{ inputs.anchor_count }}
          ROTATING_COUNT_OVERRIDE: ${{ inputs.rotating_count }}
          REPEAT_OVERRIDE: ${{ inputs.repeat }}
        run: |
          mkdir -p results
          export RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          node scripts/select-tests.mjs
          cp tests/selected.yaml results/selected-tests.yaml
          repeat="$(node -e "const s=require('./results/selection.json'); process.stdout.write(String(s.repeat))")"
          echo "EVAL_REPEAT=$repeat" >> "$GITHUB_ENV"

          echo "## 本轮抽题" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const s = require('./results/selection.json');
          console.log(`- 日期（中国时间）：${s.runDate}`);
          console.log(`- 固定锚点：${s.anchorCount} 道`);
          console.log(`- 轮换题：${s.rotatingCount} 道`);
          console.log(`- 原始题：${s.canonicalQuestionsSelected} 道；中英文测试：${s.bilingualTestsSelected} 个`);
          console.log(`- 固定锚点 ID：${s.anchors.join(', ')}`);
          console.log(`- 轮换题 ID：${s.rotating.join(', ')}`);
          NODE

      - name: Run Promptfoo
        id: promptfoo
        shell: bash
        run: |
          set +e
          npx -y promptfoo@0.123.1 eval \
            -c promptfooconfig.yaml \
            --no-cache \
            --no-share \
            --repeat "$EVAL_REPEAT" \
            --max-concurrency 4 \
            -o results/results.json \
            -o results/results.html
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          # Assertion failures are monitoring data, not infrastructure failures.
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then
            exit "$status"
          fi

      - name: Build compact summary
        if: always()
        shell: bash
        run: |
          if [ -f results/results.json ]; then
            node scripts/summarize.mjs results/results.json results/summary.json results/summary.md
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Promptfoo did not produce results/results.json." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-intelligence-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 90

      - name: Email test report
        if: always()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PROMPTFOO_OUTCOME: ${{ steps.promptfoo.outcome }}
          PROMPTFOO_EXIT_CODE: ${{ steps.promptfoo.outputs.exit_code }}
        run: python scripts/send_email.py
