name: Generic frontier Sol effort calibration

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Scope concurrency to the triggering commit. Unrelated pushes still create
  # skipped workflow runs, but can no longer evict a pending calibration run.
  group: generic-frontier-sol-calibration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-frontier-effort]')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      efforts: ${{ steps.matrix.outputs.efforts }}
      trials: ${{ steps.matrix.outputs.trials }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check frontier funnel eligibility
        id: eligibility
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const target=require('./benchmarks/frontier-effort-target.json');
          let registry={tasks:[]};
          try { registry=JSON.parse(fs.readFileSync('./benchmarks/frontier-registry.json','utf8')); } catch {}
          const item=(registry.tasks||[]).find(x=>x.id===target.task);
          const blocked=new Set(['coverage-only-ceiling','invalid-or-superseded','retired']);
          const eligible=!(item && blocked.has(item.status) && target.force !== true);
          console.log('eligible='+String(eligible));
          if (!eligible) {
            console.error('Skipping expensive effort calibration for '+target.task+' because registry status is '+item.status+'.');
          } else {
            console.error('Frontier funnel eligibility OK for '+target.task+(item?' ('+item.status+')':' (unregistered candidate)'));
          }
          NODE
      - name: Load effort matrix
        if: steps.eligibility.outputs.eligible == 'true'
        id: matrix
        shell: bash
        run: |
          efforts="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(JSON.stringify(x.efforts ?? ['medium','xhigh']))")"
          trials="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');const n=Math.max(1,Number(x.trials ?? 1));process.stdout.write(JSON.stringify(Array.from({length:n},(_,i)=>i+1)))")"
          echo "efforts=$efforts" >> "$GITHUB_OUTPUT"
          echo "trials=$trials" >> "$GITHUB_OUTPUT"

  eval:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        effort: ${{ fromJSON(needs.prepare.outputs.efforts) }}
        trial: ${{ fromJSON(needs.prepare.outputs.trials) }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Load target
        id: target
        shell: bash
        run: |
          task="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(x.task)")"
          model="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(x.model ?? 'gpt-6.1-sol')")"
          max_turns="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(String(x.max_turns ?? 12))")"
          shell_budget="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(String(x.shell_budget ?? 12))")"
          probe_budget="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(String(x.probe_budget ?? 12))")"
          fixed_variant="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(x.fixed_variant == null ? '' : String(x.fixed_variant))")"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "max_turns=$max_turns" >> "$GITHUB_OUTPUT"
          echo "shell_budget=$shell_budget" >> "$GITHUB_OUTPUT"
          echo "probe_budget=$probe_budget" >> "$GITHUB_OUTPUT"
          echo "fixed_variant=$fixed_variant" >> "$GITHUB_OUTPUT"

      - name: Prepare
        shell: bash
        run: |
          TASK="${{ steps.target.outputs.task }}"
          TASK_DIR="/tmp/frontier-effort-$TASK-${{ matrix.effort }}-t${{ matrix.trial }}"
          rm -rf "$TASK_DIR"; mkdir -p "$TASK_DIR"
          cp -R "benchmarks/$TASK/workspace/." "$TASK_DIR/"
          VARIANT_ID="${{ steps.target.outputs.fixed_variant }}"
          if [ -z "$VARIANT_ID" ]; then VARIANT_ID="${{ matrix.trial }}"; fi
          VARIANT_DIR="benchmarks/$TASK/variants/$VARIANT_ID"
          if [ -d "$VARIANT_DIR" ]; then
            cp -R "$VARIANT_DIR/." "$TASK_DIR/"
            printf '%s\n' "$VARIANT_ID" > "$TASK_DIR/.frontier-variant"
          fi
          [ ! -f "$TASK_DIR/ctl" ] || chmod +x "$TASK_DIR/ctl"
          if [ -f "$TASK_DIR/run_visible_tests.sh" ]; then
            chmod +x "$TASK_DIR/run_visible_tests.sh"
            (cd "$TASK_DIR" && ./run_visible_tests.sh)
          fi
          if [ -f "$TASK_DIR/check_generated.sh" ]; then chmod +x "$TASK_DIR/check_generated.sh"; fi
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run lightweight agent
        id: agent
        env:
          AGENT_MAX_TURNS: ${{ steps.target.outputs.max_turns }}
          AGENT_SHELL_BUDGET: ${{ steps.target.outputs.shell_budget }}
        shell: bash
        run: |
          TASK="${{ steps.target.outputs.task }}"
          VALIDATOR=""
          if [ -f "$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py"
          elif [ -f "$GITHUB_WORKSPACE/scripts/validators/$TASK.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/scripts/validators/$TASK.py"
          fi
          if [ -n "$VALIDATOR" ]; then
            export AGENT_VALIDATION_COMMAND="python '$VALIDATOR' '$TASK_DIR'"
            export AGENT_VALIDATION_BUDGET="8"
          fi
          PROBE="$GITHUB_WORKSPACE/scripts/probes/$TASK.py"
          if [ -f "$PROBE" ]; then
            export AGENT_PROBE_SCRIPT="$PROBE"
            export AGENT_PROBE_BUDGET="${{ steps.target.outputs.probe_budget }}"
          fi
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "${{ steps.target.outputs.model }}"             "${{ matrix.effort }}"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py             "${{ steps.target.outputs.task }}"             "$TASK_DIR"             "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"light-agent-result.json"
          runner=json.loads(rp.read_text()) if rp.exists() else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          if infra:
              outcome="infrastructure_error"
          elif exit_code==0:
              outcome="completed"
          elif exit_code==124:
              outcome="model_timeout"
          else:
              outcome="runner_error"
          result={
            "task":"${{ steps.target.outputs.task }}",
            "model":"${{ steps.target.outputs.model }}",
            "effort":"${{ matrix.effort }}",
            "trial":int("${{ matrix.trial }}"),
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "max_turns":runner.get("max_turns"),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "validation_calls":runner.get("validation_calls",0),
            "validation_budget":runner.get("validation_budget",0),
            "validation_enabled":runner.get("validation_enabled",False),
            "probe_calls":runner.get("probe_calls",0),
            "probe_attempts":runner.get("probe_attempts",runner.get("probe_calls",0)),
            "probe_budget":runner.get("probe_budget",0),
            "probe_enabled":runner.get("probe_enabled",False),
            "patch_metrics":runner.get("patch_metrics",{}),
            "turn_limit_reached":bool(runner.get("max_turns")) and runner.get("responses",0) >= runner.get("max_turns"),
            "shell_budget_reached":bool(runner.get("shell_budget")) and runner.get("shell_commands",0) >= runner.get("shell_budget"),
            "finished_with_message":bool(runner.get("final_text")),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/light-agent-result.json")
          for name in ["REVIEW.md","FINDINGS.json","PLAN.md","plan.json","REPORT.txt","DIAGNOSIS.json","REPAIR.json","DECISION.json",".actions"]:
              p=root/name
              if p.exists():
                  if p.is_dir(): shutil.copytree(p,"result/"+name.replace("/","_"),dirs_exist_ok=True)
                  else: shutil.copy2(p,"result/"+name.replace("/","_"))
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-effort-${{ steps.target.outputs.task }}-${{ matrix.effort }}-t${{ matrix.trial }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: eval
    concurrency:
      group: frontier-effort-results-publish
      cancel-in-progress: false
    permissions:
      contents: write
    if: always() && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: frontier-effort-*-${{ github.run_id }}
          path: results/frontier-effort
      - name: Summarize
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const rows=[];
          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const f=path.join(p,e.name);if(e.isDirectory())walk(f);else if(e.name==='result.json')rows.push(JSON.parse(fs.readFileSync(f,'utf8')))}}
          walk('results/frontier-effort');
          rows.sort((a,b)=>a.effort.localeCompare(b.effort) || Number(a.trial??1)-Number(b.trial??1));
          const target=require('./benchmarks/frontier-effort-target.json');
          const out={generated_at:new Date().toISOString(),trial_mode:target.trial_mode??'repeats',rows};
          fs.writeFileSync('results/frontier-effort-summary.json',JSON.stringify(out,null,2)+'\n');
          let md='# Frontier Effort Calibration\n\n| Effort | Trial | Score | Runtime | Turns | Turn cap | Shell | Shell cap | Saturated | Outcome |\n|---|---:|---:|---:|---:|---:|---:|---:|---|---|\n';
          for(const r of rows) {
            const sat=(r.turn_limit_reached||r.shell_budget_reached)?'yes':'no';
            md+=`| ${r.effort} | ${r.trial??1} | ${r.score} | ${r.duration_seconds}s | ${r.responses??0} | ${r.max_turns??'-'} | ${r.shell_commands??0} | ${r.shell_budget??'-'} | ${sat} | ${r.outcome} |\n`;
          }
          fs.writeFileSync('results/frontier-effort-summary.md',md);
          console.log(md);
          NODE
          node scripts/analyze-effort-efficiency.mjs \
            results/frontier-effort-summary.json \
            benchmarks/application-selection-policy.json \
            results/frontier-effort-analysis.json \
            results/frontier-effort-analysis.md
          cat results/frontier-effort-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf "\n\n" >> "$GITHUB_STEP_SUMMARY"
          cat results/frontier-effort-analysis.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-effort-summary-${{ github.run_id }}
          path: |
            results/frontier-effort-summary.json
            results/frontier-effort-summary.md
            results/frontier-effort-analysis.json
            results/frontier-effort-analysis.md
          retention-days: 30


      - name: Publish latest frontier effort result
        shell: bash
        run: |
          cp results/frontier-effort-summary.json /tmp/frontier-effort-summary.json
          cp results/frontier-effort-summary.md /tmp/frontier-effort-summary.md
          cp results/frontier-effort-analysis.json /tmp/frontier-effort-analysis.json
          cp results/frontier-effort-analysis.md /tmp/frontier-effort-analysis.md
          rm -rf /tmp/frontier-effort-details
          cp -R results/frontier-effort /tmp/frontier-effort-details
          TASK="$(node -e "const x=require('./benchmarks/frontier-effort-target.json');process.stdout.write(x.task)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin frontier-effort-results || true
          if git show-ref --verify --quiet refs/remotes/origin/frontier-effort-results; then
            git switch -C frontier-effort-results origin/frontier-effort-results
          else
            git switch --orphan frontier-effort-results
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p "frontier-effort/$TASK/runs"
          rm -rf "frontier-effort/$TASK/latest-details"
          cp -R /tmp/frontier-effort-details "frontier-effort/$TASK/latest-details"
          cp /tmp/frontier-effort-summary.json latest.json
          cp /tmp/frontier-effort-summary.md latest.md
          cp /tmp/frontier-effort-summary.json "frontier-effort/$TASK/latest.json"
          cp /tmp/frontier-effort-summary.md "frontier-effort/$TASK/latest.md"
          cp /tmp/frontier-effort-analysis.json "frontier-effort/$TASK/analysis-latest.json"
          cp /tmp/frontier-effort-analysis.md "frontier-effort/$TASK/analysis-latest.md"
          cp /tmp/frontier-effort-summary.json "frontier-effort/$TASK/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/frontier-effort-summary.md "frontier-effort/$TASK/runs/${GITHUB_RUN_ID}.md"
          cp /tmp/frontier-effort-analysis.json "frontier-effort/$TASK/runs/${GITHUB_RUN_ID}-analysis.json"
          cp /tmp/frontier-effort-analysis.md "frontier-effort/$TASK/runs/${GITHUB_RUN_ID}-analysis.md"
          git add latest.json latest.md frontier-effort
          if ! git diff --cached --quiet; then
            git commit -m "Record frontier effort calibration $TASK ${GITHUB_RUN_ID}"
            git push origin HEAD:frontier-effort-results
          fi
