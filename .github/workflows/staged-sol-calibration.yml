name: Staged application Sol calibration

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-staged-sol]')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        effort: [medium, high, xhigh]

    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare
        shell: bash
        run: |
          TASK_DIR="/tmp/staged-migration-${{ matrix.effort }}"
          rm -rf "$TASK_DIR"
          mkdir -p "$TASK_DIR"
          cp -R benchmarks/frontier-migration/workspace/. "$TASK_DIR/"
          cp benchmarks/staged-migration/TASK.md "$TASK_DIR/TASK.md"
          cp benchmarks/staged-migration/STAGE2.md "$TASK_DIR/STAGE2.md"
          chmod +x "$TASK_DIR/run_visible_tests.sh"
          (cd "$TASK_DIR" && ./run_visible_tests.sh)
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run staged agent
        id: agent
        env:
          AGENT_STAGE_MAX_TURNS: "20"
          AGENT_SHELL_BUDGET: "50"
        shell: bash
        run: |
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-staged-runner.mjs \
            "$TASK_DIR" \
            "gpt-6.1-sol" \
            "${{ matrix.effort }}" \
            "$TASK_DIR/staged-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score final state
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py frontier-migration "$TASK_DIR" "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"staged-agent-result.json"
          runner=json.loads(rp.read_text()) if rp.exists() else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          outcome="infrastructure_error" if infra else ("completed" if exit_code==0 else ("model_timeout" if exit_code==124 else "runner_error"))
          stages=runner.get("stages",[])
          stage_turn_saturated=any(bool(s.get("turn_limit_reached")) for s in stages)
          shell_saturated=bool(runner.get("shell_budget_reached"))
          result={
            "task":"staged-migration",
            "model":"gpt-6.1-sol",
            "effort":"${{ matrix.effort }}",
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "stage_turn_limit_reached":stage_turn_saturated,
            "shell_budget_reached":shell_saturated,
            "stages":stages,
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/staged-agent-result.json")
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-sol-${{ matrix.effort }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: eval
    if: always() && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: staged-sol-*-${{ github.run_id }}
          path: results/staged-sol

      - name: Build staged summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path("results/staged-sol").rglob("result.json"):
              rows.append(json.loads(p.read_text()))
          order={"medium":0,"high":1,"xhigh":2}
          rows.sort(key=lambda r:order.get(r.get("effort"),99))
          out={"generated_at":"", "rows":rows}
          Path("results/staged-sol-summary.json").write_text(json.dumps(out,indent=2)+"\n")
          lines=[
              "# Staged Sol Calibration",
              "",
              "| Effort | Score | Runtime | Stages | Turns | Shell | Saturated |",
              "|---|---:|---:|---:|---:|---:|---|",
          ]
          for r in rows:
              sat=r.get("stage_turn_limit_reached") or r.get("shell_budget_reached")
              lines.append(
                  f"| {r.get('effort')} | {r.get('score')} | {r.get('duration_seconds',0)}s | "
                  f"{len(r.get('stages',[]))} | {r.get('responses',0)} | {r.get('shell_commands',0)} | "
                  f"{'yes' if sat else 'no'} |"
              )
          Path("results/staged-sol-summary.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          cat results/staged-sol-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: staged-sol-summary-${{ github.run_id }}
          path: |
            results/staged-sol-summary.json
            results/staged-sol-summary.md
          retention-days: 30

      - name: Publish latest staged calibration
        shell: bash
        run: |
          cp results/staged-sol-summary.json /tmp/staged-sol-summary.json
          cp results/staged-sol-summary.md /tmp/staged-sol-summary.md
          rm -rf /tmp/staged-sol-details
          cp -R results/staged-sol /tmp/staged-sol-details

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin staged-calibration-results || true
          if git show-ref --verify --quiet refs/remotes/origin/staged-calibration-results; then
            git switch -C staged-calibration-results origin/staged-calibration-results
          else
            git switch --orphan staged-calibration-results
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p staged-migration/runs
          rm -rf staged-migration/latest-details
          cp -R /tmp/staged-sol-details staged-migration/latest-details
          cp /tmp/staged-sol-summary.json staged-migration/latest.json
          cp /tmp/staged-sol-summary.md staged-migration/latest.md
          cp /tmp/staged-sol-summary.json "staged-migration/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/staged-sol-summary.md "staged-migration/runs/${GITHUB_RUN_ID}.md"
          git add staged-migration
          if ! git diff --cached --quiet; then
            git commit -m "Record staged migration calibration ${GITHUB_RUN_ID}"
            git push origin HEAD:staged-calibration-results
          fi
