name: Generic frontier candidate screen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  screen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-frontier-screen]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Load target
        id: target
        shell: bash
        run: |
          task="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(x.task)")"
          model="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(x.model)")"
          effort="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(x.effort)")"
          max_turns="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(String(x.max_turns ?? 12))")"
          shell_budget="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(String(x.shell_budget ?? 12))")"
          validation_script="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(String(x.validation_script ?? ''))")"
          validation_budget="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(String(x.validation_budget ?? 8))")"
          probe_budget="$(node -e "const x=require('./benchmarks/frontier-screen-target.json');process.stdout.write(String(x.probe_budget ?? 12))")"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "max_turns=$max_turns" >> "$GITHUB_OUTPUT"
          echo "shell_budget=$shell_budget" >> "$GITHUB_OUTPUT"
          echo "validation_script=$validation_script" >> "$GITHUB_OUTPUT"
          echo "validation_budget=$validation_budget" >> "$GITHUB_OUTPUT"
          echo "probe_budget=$probe_budget" >> "$GITHUB_OUTPUT"

      - name: Prepare
        shell: bash
        run: |
          TASK="${{ steps.target.outputs.task }}"
          TASK_DIR="/tmp/frontier-screen-$TASK"
          rm -rf "$TASK_DIR"; mkdir -p "$TASK_DIR"
          cp -R "benchmarks/$TASK/workspace/." "$TASK_DIR/"
          [ ! -f "$TASK_DIR/ctl" ] || chmod +x "$TASK_DIR/ctl"
          if [ -f "$TASK_DIR/run_visible_tests.sh" ]; then
            chmod +x "$TASK_DIR/run_visible_tests.sh"
            (cd "$TASK_DIR" && ./run_visible_tests.sh)
          fi
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run lightweight agent
        id: agent
        env:
          AGENT_MAX_TURNS: ${{ steps.target.outputs.max_turns }}
          AGENT_SHELL_BUDGET: ${{ steps.target.outputs.shell_budget }}
        shell: bash
        run: |
          TASK="${{ steps.target.outputs.task }}"
          VALIDATOR=""
          if [ -n "${{ steps.target.outputs.validation_script }}" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/${{ steps.target.outputs.validation_script }}"
          elif [ -f "$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py"
          elif [ -f "$GITHUB_WORKSPACE/scripts/validators/$TASK.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/scripts/validators/$TASK.py"
          fi
          if [ -n "$VALIDATOR" ]; then
            export AGENT_VALIDATION_COMMAND="python '$VALIDATOR' '$TASK_DIR'"
            export AGENT_VALIDATION_BUDGET="${{ steps.target.outputs.validation_budget }}"
          fi
          PROBE="$GITHUB_WORKSPACE/scripts/probes/$TASK.py"
          if [ -f "$PROBE" ]; then
            export AGENT_PROBE_SCRIPT="$PROBE"
            export AGENT_PROBE_BUDGET="${{ steps.target.outputs.probe_budget }}"
          fi
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "${{ steps.target.outputs.model }}"             "${{ steps.target.outputs.effort }}"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py             "${{ steps.target.outputs.task }}"             "$TASK_DIR"             "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          runner_path=root/"light-agent-result.json"
          runner=json.loads(runner_path.read_text()) if runner_path.exists() else {}
          turn_limit=bool(runner.get("max_turns")) and runner.get("responses",0) >= runner.get("max_turns")
          shell_limit=bool(runner.get("shell_budget")) and runner.get("shell_commands",0) >= runner.get("shell_budget")
          saturated=turn_limit or shell_limit
          quality=float(score["score"])
          if saturated and quality < 95:
              classification="budget-confounded-needs-repeat"
          elif quality >= 95:
              classification="coverage-only-ceiling"
          elif quality <= 20:
              classification="too-hard-or-invalid"
          else:
              classification="promising-candidate"
          result={
            "task":"${{ steps.target.outputs.task }}",
            "model":"${{ steps.target.outputs.model }}",
            "effort":"${{ steps.target.outputs.effort }}",
            "score":score["score"],
            "classification":classification,
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "max_turns":runner.get("max_turns"),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "validation_calls":runner.get("validation_calls",0),
            "validation_budget":runner.get("validation_budget",0),
            "validation_enabled":runner.get("validation_enabled",False),
            "probe_calls":runner.get("probe_calls",0),
            "probe_attempts":runner.get("probe_attempts",runner.get("probe_calls",0)),
            "probe_budget":runner.get("probe_budget",0),
            "probe_enabled":runner.get("probe_enabled",False),
            "turn_limit_reached":turn_limit,
            "shell_budget_reached":shell_limit,
            "finished_with_message":bool(runner.get("final_text")),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":runner.get("infrastructure_error"),
            "agent_exit_code":int("${{ steps.agent.outputs.exit_code || '999' }}")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if runner_path.exists(): shutil.copy2(runner_path,"result/light-agent-result.json")
          for name in ["REVIEW.md","PLAN.md","plan.json","REPORT.txt","FINDINGS.json",".actions"]:
              p=root/name
              if p.exists(): shutil.copy2(p,"result/"+name)
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-generic-screen-${{ steps.target.outputs.task }}-${{ github.run_id }}
          path: result/
          retention-days: 30


      - name: Publish latest frontier screen result
        if: always()
        shell: bash
        run: |
          if [ ! -f result/result.json ]; then
            echo "No result/result.json to publish"
            exit 0
          fi
          cp result/result.json /tmp/frontier-screen-result.json
          rm -rf /tmp/frontier-screen-details
          cp -R result /tmp/frontier-screen-details
          rm -rf /tmp/frontier-screen-final-src
          if [ -d result/final-src ]; then cp -R result/final-src /tmp/frontier-screen-final-src; fi
          if [ -f result/light-agent-result.json ]; then cp result/light-agent-result.json /tmp/frontier-screen-agent.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin frontier-screen-results || true
          if git show-ref --verify --quiet refs/remotes/origin/frontier-screen-results; then
            git switch -C frontier-screen-results origin/frontier-screen-results
          else
            git switch --orphan frontier-screen-results
            git rm -rf --ignore-unmatch .
          fi
          TASK="${{ steps.target.outputs.task }}"
          mkdir -p "frontier-screen/$TASK/runs"
          rm -rf "frontier-screen/$TASK/latest-details"
          cp -R /tmp/frontier-screen-details "frontier-screen/$TASK/latest-details"
          cp /tmp/frontier-screen-result.json latest.json
          cp /tmp/frontier-screen-result.json "frontier-screen/$TASK/latest.json"
          cp /tmp/frontier-screen-result.json "frontier-screen/$TASK/runs/${GITHUB_RUN_ID}.json"
          rm -rf "frontier-screen/$TASK/latest-src"
          if [ -d /tmp/frontier-screen-final-src ]; then cp -R /tmp/frontier-screen-final-src "frontier-screen/$TASK/latest-src"; fi
          if [ -f /tmp/frontier-screen-agent.json ]; then cp /tmp/frontier-screen-agent.json "frontier-screen/$TASK/latest-agent.json"; fi
          git add latest.json frontier-screen
          if ! git diff --cached --quiet; then
            git commit -m "Record frontier screen $TASK ${GITHUB_RUN_ID}"
            git push origin HEAD:frontier-screen-results
          fi
