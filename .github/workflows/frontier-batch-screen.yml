name: Frontier batch candidate screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/frontier-batch.txt"
permissions:
  contents: read

concurrency:
  group: frontier-batch-candidate-screen
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-frontier-batch]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      model: ${{ steps.matrix.outputs.model }}
      effort: ${{ steps.matrix.outputs.effort }}
      eligible: ${{ steps.matrix.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify compact hidden reference before billing
        run: |
          python3 scripts/selfcheck-compact-contract.py
      - name: Upload no-cost reference admission
        uses: actions/upload-artifact@v4
        with:
          name: compact-reference-admission-${{ github.run_id }}
          path: compact-reference-admission.json
          retention-days: 30
      - id: matrix
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const x=require('./benchmarks/frontier-batch-screen.json');
          const registry=require('./benchmarks/frontier-registry.json');
          const blocked=new Set(['coverage-only-ceiling','retired','invalid-or-superseded']);
          const known=new Map((registry.tasks??[]).map(t=>[t.id,t]));
          const cases=x.enabled===false?[]:x.tasks.filter(t=>{
            const status=known.get(t.task)?.status;
            return !blocked.has(status);
          });
          if(cases.length!==x.tasks.length && x.enabled!==false)
            console.error('Blocked already-retired or coverage-only candidates');
          console.log('eligible='+String(cases.length>0));
          console.log('matrix='+JSON.stringify({include:cases}));
          console.log('model='+x.model);
          console.log('effort='+x.effort);
          NODE

  screen:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare isolated task
        shell: bash
        run: |
          TASK="${{ matrix.task }}"
          TASK_DIR="/tmp/frontier-batch-$TASK"
          rm -rf "$TASK_DIR"; mkdir -p "$TASK_DIR"
          cp -R "benchmarks/$TASK/workspace/." "$TASK_DIR/"
          [ ! -f "$TASK_DIR/ctl" ] || chmod +x "$TASK_DIR/ctl"
          [ ! -f "$TASK_DIR/run_visible_tests.sh" ] || chmod +x "$TASK_DIR/run_visible_tests.sh"
          [ ! -f "$TASK_DIR/check_generated.sh" ] || chmod +x "$TASK_DIR/check_generated.sh"
          if [ -f "$TASK_DIR/run_visible_tests.sh" ]; then
            (cd "$TASK_DIR" && ./run_visible_tests.sh)
          fi
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Start isolated Java benchmark container
        shell: bash
        run: |
          name="compact-${GITHUB_RUN_ID}-${{ strategy.job-index }}"
          docker run -d --name "$name" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 768m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,size=64m \
            -v "$TASK_DIR:/app:rw" -w /app \
            eclipse-temurin:17-jdk-jammy tail -f /dev/null
          echo "AGENT_DOCKER_CONTAINER=$name" >> "$GITHUB_ENV"
          echo "AGENT_DOCKER_WORKDIR=/app" >> "$GITHUB_ENV"

      - name: Verify Docker editing toolchain without model calls
        shell: bash
        run: |
          docker exec "$AGENT_DOCKER_CONTAINER" /bin/bash -lc \
            'pwd; test -w src; command -v javac; command -v sed; command -v python3 || true; command -v patch || true; printf smoke > .shell-smoke; test -f .shell-smoke; rm .shell-smoke'

      - name: Run Luna screen
        id: agent
        env:
          AGENT_MAX_TURNS: ${{ matrix.max_turns }}
          AGENT_CAPTURE_SHELL_TRACE: "1"
          AGENT_SHELL_BUDGET: ${{ matrix.shell_budget }}
          AGENT_WALL_TIMEOUT_MS: ${{ matrix.wall_timeout_ms || 290000 }}
          AGENT_API_TIMEOUT_MS: 120000
        shell: bash
        run: |
          TASK="${{ matrix.task }}"
          VALIDATOR=""
          if [ -f "$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py"
          elif [ -f "$GITHUB_WORKSPACE/scripts/validators/$TASK.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/scripts/validators/$TASK.py"
          fi
          if [ -n "$VALIDATOR" ]; then
            export AGENT_VALIDATION_COMMAND="python '$VALIDATOR' '$TASK_DIR'"
            export AGENT_VALIDATION_BUDGET="8"
          fi
          PROBE="$GITHUB_WORKSPACE/scripts/probes/$TASK.py"
          if [ -f "$PROBE" ]; then
            export AGENT_PROBE_SCRIPT="$PROBE"
            export AGENT_PROBE_BUDGET="20"
          fi
          start="$(date +%s)"
          set +e
          timeout 330s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "${{ needs.prepare.outputs.model }}"             "${{ needs.prepare.outputs.effort }}"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score candidate
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py             "${{ matrix.task }}"             "$TASK_DIR"             "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"light-agent-result.json"
          runner=json.loads(rp.read_text()) if rp.exists() else {}
          rp_exists=rp.exists()
          turn_limit=bool(runner.get("max_turns")) and runner.get("responses",0)>=runner.get("max_turns")
          shell_limit=bool(runner.get("shell_budget")) and runner.get("shell_commands",0)>=runner.get("shell_budget")
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          timeout=bool(runner.get("model_timeout")) or exit_code==124
          saturated=turn_limit or shell_limit or timeout
          quality=float(score["score"])
          if not rp_exists or infra or exit_code not in (0,124):
              classification="incomplete-infrastructure"
              outcome="infrastructure_error" if infra else "runner_error"
              data_complete=False
          elif timeout:
              classification="budget-confounded-timeout"
              outcome="model_timeout"
              data_complete=True
          elif saturated:
              classification="budget-confounded-limit"
              outcome="budget_confounded"
              data_complete=True
          elif quality >= 95:
              classification="coverage-only-ceiling"
              outcome="completed"
              data_complete=True
          elif quality <= 20:
              classification="too-hard-or-invalid"
              outcome="completed"
              data_complete=True
          else:
              classification="promising-candidate"
              outcome="completed"
              data_complete=True
          result={
            "task":"${{ matrix.task }}",
            "model":"${{ needs.prepare.outputs.model }}",
            "effort":"${{ needs.prepare.outputs.effort }}",
            "score":score["score"],
            "classification":classification,
            "outcome":outcome,
            "data_complete":data_complete,
            "runner_telemetry_present":rp_exists,
            "model_timeout":timeout,
            "saturated":saturated,
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "max_turns":runner.get("max_turns"),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "shell_trace":runner.get("shell_trace",[]),
            "validation_calls":runner.get("validation_calls",0),
            "validation_budget":runner.get("validation_budget",0),
            "validation_enabled":runner.get("validation_enabled",False),
            "probe_calls":runner.get("probe_calls",0),
            "probe_attempts":runner.get("probe_attempts",0),
            "probe_budget":runner.get("probe_budget",0),
            "probe_enabled":runner.get("probe_enabled",False),
            "turn_limit_reached":turn_limit,
            "shell_budget_reached":shell_limit,
            "finished_with_message":bool(runner.get("final_text")),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":runner.get("infrastructure_error"),
            "agent_exit_code":exit_code
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/light-agent-result.json")
          for name in ["REVIEW.md","PLAN.md","plan.json","REPORT.txt","FINDINGS.json"]:
              p=root/name
              if p.exists(): shutil.copy2(p,"result/"+name)
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          PY

      - name: Stop isolated Java benchmark container
        if: always()
        shell: bash
        run: |
          if [ -n "${AGENT_DOCKER_CONTAINER:-}" ]; then
            docker rm -f "$AGENT_DOCKER_CONTAINER" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-batch-${{ matrix.task }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: [prepare, screen]
    if: always() && needs.prepare.result == 'success' && needs.screen.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frontier-batch-*-${{ github.run_id }}
          path: results/frontier-batch
      - uses: actions/download-artifact@v4
        with:
          name: compact-reference-admission-${{ github.run_id }}
          path: results/reference

      - name: Summarize batch
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path("results/frontier-batch").rglob("result.json"):
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x["task"])
          out={"rows":rows}
          Path("frontier-batch-summary.json").write_text(json.dumps(out,indent=2)+"\n")
          lines=[
              "# Frontier Batch Screen",
              "",
              "| Task | Score | Class | Runtime | Turns | Shell | Saturated |",
              "|---|---:|---|---:|---:|---:|---|",
          ]
          for r in rows:
              sat=r.get("saturated",False)
              lines.append(
                  f"| {r['task']} | {r['score']} | {r['classification']} | "
                  f"{r.get('duration_seconds',0)}s | {r.get('responses',0)} | "
                  f"{r.get('shell_commands',0)} | {'yes' if sat else 'no'} |"
              )
          Path("frontier-batch-summary.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          cat frontier-batch-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-batch-summary-${{ github.run_id }}
          path: |
            frontier-batch-summary.json
            frontier-batch-summary.md
          retention-days: 30

      - name: Publish latest batch screen
        shell: bash
        run: |
          cp frontier-batch-summary.json /tmp/frontier-batch-summary.json
          cp frontier-batch-summary.md /tmp/frontier-batch-summary.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin frontier-batch-results || true
          if git show-ref --verify --quiet refs/remotes/origin/frontier-batch-results; then
            git switch -C frontier-batch-results origin/frontier-batch-results
          else
            git switch --orphan frontier-batch-results
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p frontier-batch/runs
          cp /tmp/frontier-batch-summary.json frontier-batch/latest.json
          cp /tmp/frontier-batch-summary.md frontier-batch/latest.md
          cp results/reference/compact-reference-admission.json frontier-batch/reference-admission-latest.json
          cp /tmp/frontier-batch-summary.json "frontier-batch/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/frontier-batch-summary.md "frontier-batch/runs/${GITHUB_RUN_ID}.md"
          git add frontier-batch
          if ! git diff --cached --quiet; then
            git commit -m "Record frontier batch screen ${GITHUB_RUN_ID}"
            git push origin HEAD:frontier-batch-results
          fi
