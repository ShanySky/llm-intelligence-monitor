name: Frontier effort stability validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/frontier-effort-stability.txt"

permissions:
  contents: read

concurrency:
  # Scope concurrency to the triggering commit. Unrelated pushes still create
  # skipped workflow runs, but can no longer evict a pending calibration run.
  group: frontier-effort-stability-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-frontier-stability]')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.matrix.outputs.eligible }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: matrix
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const x=require('./benchmarks/frontier-stability-target.json');
          const enabled=x.enabled !== false;
          console.log('eligible='+String(enabled));
          const include=[];
          for (const effort of (x.efforts ?? ['medium','high','xhigh'])) {
            for (let trial=1; trial<=Number(x.repeats ?? 3); trial++) {
              include.push({effort,trial});
            }
          }
          console.log('matrix='+JSON.stringify({include}));
          NODE

  eval:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Load target
        id: target
        shell: bash
        run: |
          task="$(node -e "const x=require('./benchmarks/frontier-stability-target.json');process.stdout.write(x.task)")"
          model="$(node -e "const x=require('./benchmarks/frontier-stability-target.json');process.stdout.write(x.model ?? 'gpt-6.1-sol')")"
          max_turns="$(node -e "const x=require('./benchmarks/frontier-stability-target.json');process.stdout.write(String(x.max_turns ?? 40))")"
          shell_budget="$(node -e "const x=require('./benchmarks/frontier-stability-target.json');process.stdout.write(String(x.shell_budget ?? 40))")"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "max_turns=$max_turns" >> "$GITHUB_OUTPUT"
          echo "shell_budget=$shell_budget" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated task
        shell: bash
        run: |
          TASK="${{ steps.target.outputs.task }}"
          TASK_DIR="/tmp/frontier-stability-$TASK-${{ matrix.effort }}-${{ matrix.trial }}"
          rm -rf "$TASK_DIR"; mkdir -p "$TASK_DIR"
          cp -R "benchmarks/$TASK/workspace/." "$TASK_DIR/"
          [ ! -f "$TASK_DIR/ctl" ] || chmod +x "$TASK_DIR/ctl"
          [ ! -f "$TASK_DIR/run_visible_tests.sh" ] || chmod +x "$TASK_DIR/run_visible_tests.sh"
          [ ! -f "$TASK_DIR/check_generated.sh" ] || chmod +x "$TASK_DIR/check_generated.sh"
          if [ -f "$TASK_DIR/run_visible_tests.sh" ]; then
            (cd "$TASK_DIR" && ./run_visible_tests.sh)
          fi
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run lightweight agent
        id: agent
        env:
          AGENT_MAX_TURNS: ${{ steps.target.outputs.max_turns }}
          AGENT_SHELL_BUDGET: ${{ steps.target.outputs.shell_budget }}
        shell: bash
        run: |
          TASK="${{ steps.target.outputs.task }}"
          VALIDATOR=""
          if [ -f "$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py"
          elif [ -f "$GITHUB_WORKSPACE/scripts/validators/$TASK.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/scripts/validators/$TASK.py"
          fi
          if [ -n "$VALIDATOR" ]; then
            export AGENT_VALIDATION_COMMAND="python '$VALIDATOR' '$TASK_DIR'"
            export AGENT_VALIDATION_BUDGET="8"
          fi
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-runner.mjs \
            "$TASK_DIR" \
            "${{ steps.target.outputs.model }}" \
            "${{ matrix.effort }}" \
            "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py \
            "${{ steps.target.outputs.task }}" \
            "$TASK_DIR" \
            "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"light-agent-result.json"
          runner_present=rp.exists()
          runner=json.loads(rp.read_text()) if runner_present else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          if infra:
              outcome="infrastructure_error"
          elif exit_code==0 and runner_present:
              outcome="completed"
          elif exit_code==124 and runner_present:
              outcome="model_timeout"
          elif exit_code==124:
              outcome="pre_telemetry_timeout"
          else:
              outcome="runner_error"
          result={
            "task":"${{ steps.target.outputs.task }}",
            "model":"${{ steps.target.outputs.model }}",
            "effort":"${{ matrix.effort }}",
            "trial":int("${{ matrix.trial }}"),
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "shell_commands":runner.get("shell_commands",0),
            "validation_calls":runner.get("validation_calls",0),
            "validation_budget":runner.get("validation_budget",0),
            "validation_enabled":runner.get("validation_enabled",False),
            "max_turns":runner.get("max_turns"),
            "shell_budget":runner.get("shell_budget"),
            "saturated":(
                bool(runner.get("max_turns")) and runner.get("responses",0)>=runner.get("max_turns")
            ) or (
                bool(runner.get("shell_budget")) and runner.get("shell_commands",0)>=runner.get("shell_budget")
            ),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "model_timeout":bool(runner.get("model_timeout")),
            "timeout_reason":runner.get("timeout_reason"),
            "runner_telemetry_present":runner_present,
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":runner_present and outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/light-agent-result.json")
          for name in ["REVIEW.md","PLAN.md","plan.json","REPORT.txt","FINDINGS.json",".actions"]:
              p=root/name
              if p.exists(): shutil.copy2(p,"result/"+name)
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-stability-${{ steps.target.outputs.task }}-${{ matrix.effort }}-${{ matrix.trial }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: [prepare, eval]
    if: always() && needs.prepare.result == 'success' && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frontier-stability-*-${{ github.run_id }}
          path: results/frontier-stability

      - name: Analyze repeated stability
        shell: bash
        run: |
          python - <<'PY'
          import json, math, statistics
          from pathlib import Path

          rows=[]
          for p in Path("results/frontier-stability").rglob("result.json"):
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda r:({"medium":0,"high":1,"xhigh":2}.get(r.get("effort"),99),r.get("trial",0)))

          def mean(xs):
              return sum(xs)/len(xs) if xs else None
          def pstdev(xs):
              return statistics.pstdev(xs) if len(xs)>1 else 0.0
          def pct(base,candidate):
              if base is None or candidate is None or base<=0:
                  return None
              return (base-candidate)/base*100.0
          def total_tokens(r):
              u=r.get("usage",{})
              return int(u.get("input_tokens",0))+int(u.get("output_tokens",0))

          grouped={}
          for r in rows:
              grouped.setdefault(r["effort"],[]).append(r)

          stats={}
          for effort,xs in grouped.items():
              stats[effort]={
                  "trials":len(xs),
                  "scores":[r["score"] for r in xs],
                  "mean_score":mean([r["score"] for r in xs]),
                  "score_stddev":pstdev([r["score"] for r in xs]),
                  "mean_duration_seconds":mean([r.get("duration_seconds",0) for r in xs]),
                  "mean_shell_commands":mean([r.get("shell_commands",0) for r in xs]),
                  "mean_total_tokens":mean([total_tokens(r) for r in xs]),
                  "saturated_trials":sum(1 for r in xs if r.get("saturated")),
                  "complete_trials":sum(1 for r in xs if r.get("data_complete",True) and not r.get("infrastructure_error")),
              }

          med={r["trial"]:r for r in grouped.get("medium",[])}
          xh={r["trial"]:r for r in grouped.get("xhigh",[])}
          paired=[]
          for trial in sorted(set(med)&set(xh)):
              m,x=med[trial],xh[trial]
              paired.append({
                  "trial":trial,
                  "quality_gain_points":x["score"]-m["score"],
                  "duration_improvement_percent":pct(m.get("duration_seconds"),x.get("duration_seconds")),
                  "shell_improvement_percent":pct(m.get("shell_commands"),x.get("shell_commands")),
                  "token_improvement_percent":pct(total_tokens(m),total_tokens(x)),
              })

          min_gain=10
          min_eff=15
          majority=math.ceil(max(1,len(paired))/2)
          avg_quality=mean([p["quality_gain_points"] for p in paired])
          positive_quality=sum(1 for p in paired if p["quality_gain_points"]>=min_gain)

          metric_names=["duration_improvement_percent","shell_improvement_percent","token_improvement_percent"]
          avg_improvements={k:mean([p[k] for p in paired if p[k] is not None]) for k in metric_names}
          stable_eff_metrics=[
              k for k in metric_names
              if avg_improvements[k] is not None
              and avg_improvements[k]>=min_eff
              and sum(1 for p in paired if p[k] is not None and p[k]>0)>=majority
          ]

          med_stat=stats.get("medium",{})
          xh_stat=stats.get("xhigh",{})
          all_complete=all(r.get("data_complete",True) and not r.get("infrastructure_error") for r in rows)
          any_saturated=any(r.get("saturated") for r in rows)
          if not all_complete:
              classification="incomplete-data"
          elif any_saturated:
              classification="budget-confounded"
          elif avg_quality is not None and avg_quality>=min_gain and positive_quality>=majority:
              classification="quality-effort-confirmed"
          elif (
              med_stat.get("mean_score",0)>=95
              and xh_stat.get("mean_score",0)>=95
              and xh_stat.get("mean_score",0)>=med_stat.get("mean_score",0)
              and len(stable_eff_metrics)>=2
          ):
              classification="efficiency-effort-confirmed"
          else:
              classification="no-stable-effort-signal"

          out={
              "task":rows[0]["task"] if rows else None,
              "model":rows[0]["model"] if rows else None,
              "rows":rows,
              "by_effort":stats,
              "paired_medium_xhigh":paired,
              "average_quality_gain_points":avg_quality,
              "average_efficiency_improvements_percent":avg_improvements,
              "stable_efficiency_metrics":stable_eff_metrics,
              "classification":classification,
          }
          Path("stability-summary.json").write_text(json.dumps(out,indent=2)+"\n")

          lines=[
              "# Frontier Effort Stability",
              "",
              f"**Classification:** `{classification}`",
              "",
              "| Effort | Trials | Mean score | Score stddev | Avg runtime | Avg shell | Avg tokens | Saturated |",
              "|---|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for effort in ["medium","high","xhigh"]:
              s=stats.get(effort)
              if not s: continue
              lines.append(
                  f"| {effort} | {s['trials']} | {s['mean_score']:.1f} | {s['score_stddev']:.1f} | "
                  f"{s['mean_duration_seconds']:.1f}s | {s['mean_shell_commands']:.1f} | "
                  f"{s['mean_total_tokens']:.0f} | {s['saturated_trials']} |"
              )
          if paired:
              lines += [
                  "",
                  f"Average M→XH quality gain: {avg_quality:.1f} points.",
                  "Stable efficiency metrics: " + (", ".join(stable_eff_metrics) if stable_eff_metrics else "none") + ".",
              ]
          Path("stability-summary.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          cat stability-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-stability-summary-${{ github.run_id }}
          path: |
            stability-summary.json
            stability-summary.md
          retention-days: 60

      - name: Publish latest stability validation
        shell: bash
        run: |
          TASK="$(node -e "const x=require('./benchmarks/frontier-stability-target.json');process.stdout.write(x.task)")"
          cp stability-summary.json /tmp/stability-summary.json
          cp stability-summary.md /tmp/stability-summary.md
          rm -rf /tmp/stability-details
          cp -R results/frontier-stability /tmp/stability-details

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin frontier-stability-results || true
          if git show-ref --verify --quiet refs/remotes/origin/frontier-stability-results; then
            git switch -C frontier-stability-results origin/frontier-stability-results
          else
            git switch --orphan frontier-stability-results
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p "frontier-stability/$TASK/runs"
          rm -rf "frontier-stability/$TASK/latest-details"
          cp -R /tmp/stability-details "frontier-stability/$TASK/latest-details"
          cp /tmp/stability-summary.json "frontier-stability/$TASK/latest.json"
          cp /tmp/stability-summary.md "frontier-stability/$TASK/latest.md"
          cp /tmp/stability-summary.json "frontier-stability/$TASK/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/stability-summary.md "frontier-stability/$TASK/runs/${GITHUB_RUN_ID}.md"
          git add frontier-stability
          if ! git diff --cached --quiet; then
            git commit -m "Record frontier stability $TASK ${GITHUB_RUN_ID}"
            git push origin HEAD:frontier-stability-results
          fi
