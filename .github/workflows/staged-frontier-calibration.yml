name: Staged frontier calibration

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: staged-frontier-calibration
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-staged-frontier]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check staged runner syntax before model billing
        run: node --check scripts/light-agent-staged-runner.mjs
      - id: matrix
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const x=require('./benchmarks/staged-frontier-target.json');
          const include=[];
          for(const effort of x.efforts ?? ['high']){
            for(let trial=1;trial<=Math.max(1,Number(x.trials ?? 1));trial++){
              include.push({effort,trial});
            }
          }
          console.log('matrix='+JSON.stringify({include}));
          NODE

  eval:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Load target
        id: target
        shell: bash
        run: |
          task="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(x.task)")"
          workspace="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(x.workspace)")"
          score_task="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(x.score_task ?? x.task)")"
          model="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(x.model ?? 'gpt-6.1-sol')")"
          max_turns="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(String(x.max_turns_per_stage ?? 20))")"
          shell_budget="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(String(x.shell_budget ?? 60))")"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "score_task=$score_task" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "max_turns=$max_turns" >> "$GITHUB_OUTPUT"
          echo "shell_budget=$shell_budget" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated staged task
        shell: bash
        run: |
          TASK_DIR="/tmp/staged-frontier-${{ steps.target.outputs.task }}-${{ matrix.effort }}-t${{ matrix.trial }}"
          rm -rf "$TASK_DIR"; mkdir -p "$TASK_DIR"
          cp -R "${{ steps.target.outputs.workspace }}/." "$TASK_DIR/"
          [ ! -f "$TASK_DIR/run_visible_tests.sh" ] || chmod +x "$TASK_DIR/run_visible_tests.sh"
          if [ -f "$TASK_DIR/run_visible_tests.sh" ]; then
            (cd "$TASK_DIR" && ./run_visible_tests.sh)
          fi
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run staged agent
        id: agent
        env:
          AGENT_STAGE_MAX_TURNS: ${{ steps.target.outputs.max_turns }}
          AGENT_SHELL_BUDGET: ${{ steps.target.outputs.shell_budget }}
        shell: bash
        run: |
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-staged-runner.mjs             "$TASK_DIR"             "${{ steps.target.outputs.model }}"             "${{ matrix.effort }}"             "$TASK_DIR/staged-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score final state
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py             "${{ steps.target.outputs.score_task }}"             "$TASK_DIR"             "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"staged-agent-result.json"
          runner_present=rp.exists()
          runner=json.loads(rp.read_text()) if runner_present else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          if infra:
              outcome="infrastructure_error"
          elif exit_code==0 and runner_present:
              outcome="completed"
          elif exit_code==124 and runner_present and runner.get("model_timeout"):
              outcome="model_timeout"
          elif exit_code==124 and not runner_present:
              outcome="pre_telemetry_timeout"
          else:
              outcome="runner_error"
          stages=runner.get("stages",[])
          turn_saturated=any(bool(x.get("turn_limit_reached")) for x in stages)
          shell_saturated=bool(runner.get("shell_budget_reached"))
          result={
            "task":"${{ steps.target.outputs.task }}",
            "score_task":"${{ steps.target.outputs.score_task }}",
            "trial":int("${{ matrix.trial }}"),
            "model":"${{ steps.target.outputs.model }}",
            "effort":"${{ matrix.effort }}",
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "turn_limit_reached":turn_saturated,
            "shell_budget_reached":shell_saturated,
            "stages":stages,
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "api_timeout_ms":runner.get("api_timeout_ms"),
            "wall_timeout_ms":runner.get("wall_timeout_ms"),
            "model_timeout":bool(runner.get("model_timeout")),
            "timeout_reason":runner.get("timeout_reason"),
            "runner_telemetry_present":runner_present,
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":runner_present and outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/staged-agent-result.json")
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          for name in ["REPORT.txt","REVIEW.md","FINDINGS.json"]:
              p=root/name
              if p.exists(): shutil.copy2(p,"result/"+name)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-frontier-${{ steps.target.outputs.task }}-${{ matrix.effort }}-t${{ matrix.trial }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: [prepare, eval]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: staged-frontier-*-${{ github.run_id }}
          path: results/staged-frontier

      - name: Summarize
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const rows=[];
          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const f=path.join(p,e.name);if(e.isDirectory())walk(f);else if(e.name==='result.json')rows.push(JSON.parse(fs.readFileSync(f,'utf8')))}}
          walk('results/staged-frontier');
          const rank={medium:0,high:1,xhigh:2};
          rows.sort((a,b)=>(rank[a.effort]??99)-(rank[b.effort]??99)||Number(a.trial)-Number(b.trial));
          const out={generated_at:new Date().toISOString(),rows};
          fs.writeFileSync('results/staged-frontier-summary.json',JSON.stringify(out,null,2)+'\n');
          let md='# Staged Frontier Calibration\n\n| Model | Effort | Trial | Score | Runtime | Stages | Turns | Shell | Saturated |\n|---|---|---:|---:|---:|---:|---:|---:|---|\n';
          for(const r of rows){
            const sat=r.turn_limit_reached||r.shell_budget_reached;
            md+=`| ${r.model} | ${r.effort} | ${r.trial} | ${r.score} | ${r.duration_seconds}s | ${r.stages?.length??0} | ${r.responses??0} | ${r.shell_commands??0} | ${sat?'yes':'no'} |\n`;
          }
          fs.writeFileSync('results/staged-frontier-summary.md',md);
          console.log(md);
          NODE
          node scripts/analyze-effort-efficiency.mjs             results/staged-frontier-summary.json             benchmarks/application-selection-policy.json             results/staged-frontier-analysis.json             results/staged-frontier-analysis.md
          cat results/staged-frontier-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf "\n\n" >> "$GITHUB_STEP_SUMMARY"
          cat results/staged-frontier-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: staged-frontier-summary-${{ github.run_id }}
          path: |
            results/staged-frontier-summary.json
            results/staged-frontier-summary.md
            results/staged-frontier-analysis.json
            results/staged-frontier-analysis.md
          retention-days: 60

      - name: Publish latest staged frontier result
        shell: bash
        run: |
          TASK="$(node -e "const x=require('./benchmarks/staged-frontier-target.json');process.stdout.write(x.task)")"
          cp results/staged-frontier-summary.json /tmp/staged-frontier-summary.json
          cp results/staged-frontier-summary.md /tmp/staged-frontier-summary.md
          cp results/staged-frontier-analysis.json /tmp/staged-frontier-analysis.json
          cp results/staged-frontier-analysis.md /tmp/staged-frontier-analysis.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin staged-frontier-results || true
          if git show-ref --verify --quiet refs/remotes/origin/staged-frontier-results; then
            git switch -C staged-frontier-results origin/staged-frontier-results
          else
            git switch --orphan staged-frontier-results
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p "staged-frontier/$TASK/runs"
          cp /tmp/staged-frontier-summary.json "staged-frontier/$TASK/latest.json"
          cp /tmp/staged-frontier-summary.md "staged-frontier/$TASK/latest.md"
          cp /tmp/staged-frontier-analysis.json "staged-frontier/$TASK/analysis-latest.json"
          cp /tmp/staged-frontier-analysis.md "staged-frontier/$TASK/analysis-latest.md"
          cp /tmp/staged-frontier-summary.json "staged-frontier/$TASK/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/staged-frontier-summary.md "staged-frontier/$TASK/runs/${GITHUB_RUN_ID}.md"
          git add staged-frontier
          if ! git diff --cached --quiet; then
            git commit -m "Record staged frontier calibration $TASK ${GITHUB_RUN_ID}"
            git push origin HEAD:staged-frontier-results
          fi
