name: Frontier plan-review Luna screen

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  screen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-frontier-plan-review-screen]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare
        shell: bash
        run: |
          TASK_DIR="/tmp/frontier-plan-review"
          rm -rf "$TASK_DIR"
          mkdir -p "$TASK_DIR"
          cp -R benchmarks/frontier-plan-review/workspace/. "$TASK_DIR/"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run Luna High
        id: agent
        shell: bash
        run: |
          set +e
          timeout 420s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "gpt-6-luna"             "high"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Score
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py frontier-plan-review "$TASK_DIR" "$TASK_DIR/score.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"light-agent-result.json"
          runner=json.loads(rp.read_text()) if rp.exists() else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          outcome="infrastructure_error" if infra else ("completed" if exit_code==0 else ("model_timeout" if exit_code==124 else "runner_error"))
          result={
            "task":"frontier-plan-review",
            "model":"gpt-6-luna",
            "effort":"high",
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds",420),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          for name in ["FINDINGS.json","light-agent-result.json"]:
              p=root/name
              if p.exists(): shutil.copy2(p,"result/"+name)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-plan-review-screen-${{ github.run_id }}
          path: result/
          retention-days: 30
