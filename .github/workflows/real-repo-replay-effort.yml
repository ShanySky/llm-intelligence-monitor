name: Real repo replay effort family

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/replay-effort.txt"

permissions:
  contents: write

concurrency:
  group: real-repo-replay-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    concurrency:
      group: real-repo-replay-results-publish
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-replay-family]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      eligible: ${{ steps.matrix.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify no-cost quality and effort evidence rules
        run: |
          node tests/effort-repeat-gate.test.mjs
          node tests/application-quality-evidence.test.mjs

      - name: Reference commit self-check
        id: selfcheck
        shell: bash
        run: |
          set +e
          node - <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const c=require('./benchmarks/real-repo-replay/config.json');
          const cases=[];
          let ok=true;
          const references=[
            ...(c.cases??[]).map((x)=>({...x,required:true})),
            ...(c.backup_cases??[]).map((x)=>({...x,required:false}))
          ];
          for(const item of references){
            const row={id:item.id,target_sha:item.target_sha,behavior_score:null,error:null};
            try{
              const dir='/tmp/replay-reference-'+item.id;
              fs.rmSync(dir,{recursive:true,force:true});
              fs.mkdirSync(dir,{recursive:true});
              execFileSync('bash',['-lc',`git archive ${item.target_sha} | tar -x -C "${dir}"`],{stdio:'inherit'});
              fs.copyFileSync(`benchmarks/real-repo-replay/${item.id}/TASK.md`,dir+'/TASK.md');
              fs.writeFileSync(dir+'/light-agent-result.json',JSON.stringify({patch_metrics:{changed_files:0,changed_lines:0,added_files:0,deleted_files:0,files:[]}}));
              const out=dir+'/reference-score.json';
              execFileSync('node',['scripts/score-real-repo-replay.mjs',item.id,dir,out,'benchmarks/real-repo-replay/config.json'],{stdio:'inherit'});
              const score=JSON.parse(fs.readFileSync(out,'utf8'));
              row.behavior_score=Number(score.behavior_score);
              if(item.required && row.behavior_score!==100) ok=false;
            }catch(error){
              row.error=String(error?.message??error);
              if(item.required) ok=false;
            }
            row.required=Boolean(item.required);
            cases.push(row);
          }
          const report={generated_at:new Date().toISOString(),ok,cases};
          fs.writeFileSync('replay-reference-selfcheck.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          process.exitCode=ok?0:2;
          NODE
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish reference self-check
        shell: bash
        run: |
          cp replay-reference-selfcheck.json /tmp/replay-reference-selfcheck.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin real-repo-replay-results || true
          if git show-ref --verify --quiet refs/remotes/origin/real-repo-replay-results; then
            git switch -C real-repo-replay-results origin/real-repo-replay-results
          else
            git switch --orphan real-repo-replay-results
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p replay
          cp /tmp/replay-reference-selfcheck.json replay/reference-selfcheck.json
          git add replay/reference-selfcheck.json
          if ! git diff --cached --quiet; then
            git commit -m "Record real-repo replay reference self-check"
            git push origin HEAD:real-repo-replay-results
          fi
          # Publishing switched the working tree to the results branch. Restore
          # the triggering main commit before loading benchmark config/matrix.
          git switch --detach "$GITHUB_SHA"

      - name: Enforce reference self-check
        if: steps.selfcheck.outputs.status != '0'
        shell: bash
        run: |
          echo "Reference self-check failed; see replay/reference-selfcheck.json."
          exit 2

      - id: matrix
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const c=require('./benchmarks/real-repo-replay/config.json');
          const eligible=c.enabled!==false;
          console.log('eligible='+String(eligible));
          const include=[];
          const repeats=Number(c.repeats_per_case ?? 1);
          if (!Number.isInteger(repeats) || repeats<1 || repeats>3)
            throw new Error('Invalid repeats_per_case (supported 1..3)');
          if (c.mode==='screen' && (c.model!=='gpt-6-luna' ||
              c.efforts.length!==1 || c.efforts[0]!=='high' || repeats!==1))
            throw new Error('Screen mode must run Luna High once per case');
          if (c.mode==='effort') {
            const registry=require('./benchmarks/frontier-registry.json');
            const item=(registry.tasks??[]).find(x=>x.id==='real-repo-replay-family');
            const blocked=new Set(item?.evidence?.v2_coverage_only_cases??[]);
            const forbidden=(c.cases??[]).map(x=>x.id).filter(id=>blocked.has(id));
            if (forbidden.length) throw new Error('Coverage-only replay cases cannot consume Sol effort: '+forbidden.join(', '));
            if(c.model!=='gpt-6.1-sol') throw new Error('Resident Sol effort calibration must use gpt-6.1-sol');
          }
          for(const effort of c.efforts){
            for(const item of c.cases) for(let repeat=1;repeat<=repeats;repeat++) include.push({
              effort,
              repeat,
              model:c.model,
              family_version:c.family_version??1,
              trial:item.trial,
              case_id:item.id,
              target_sha:item.target_sha,
              max_turns:c.max_turns ?? 28,
              shell_budget:c.shell_budget ?? 20
            });
          }
          console.log('matrix='+JSON.stringify({include}));
          NODE

  eval:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare hidden-parent replay workspace
        shell: bash
        run: |
          TARGET="${{ matrix.target_sha }}"
          BASE="$(git rev-parse "$TARGET^")"
          TASK_DIR="/tmp/replay-${{ matrix.case_id }}-${{ matrix.effort }}-r${{ matrix.repeat }}"
          rm -rf "$TASK_DIR"; mkdir -p "$TASK_DIR"
          git archive "$BASE" | tar -x -C "$TASK_DIR"
          cp "benchmarks/real-repo-replay/${{ matrix.case_id }}/TASK.md" "$TASK_DIR/TASK.md"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Run agent against historical parent
        id: agent
        env:
          AGENT_MAX_TURNS: ${{ matrix.max_turns }}
          AGENT_SHELL_BUDGET: ${{ matrix.shell_budget }}
        shell: bash
        run: |
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "${{ matrix.model }}"             "${{ matrix.effort }}"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Hidden replay scoring
        if: always()
        shell: bash
        run: |
          mkdir -p result
          node scripts/score-real-repo-replay.mjs             "${{ matrix.case_id }}"             "$TASK_DIR"             "$TASK_DIR/replay-score.json"             benchmarks/real-repo-replay/config.json
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"replay-score.json").read_text())
          rp=root/"light-agent-result.json"
          runner_present=rp.exists()
          runner=json.loads(rp.read_text()) if runner_present else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          if infra: outcome="infrastructure_error"
          elif exit_code==0 and runner_present: outcome="completed"
          elif exit_code==124 and runner_present: outcome="model_timeout"
          elif exit_code==124: outcome="pre_telemetry_timeout"
          else: outcome="runner_error"
          row={
            "task":"real-repo-replay-family",
            "case_id":"${{ matrix.case_id }}",
            "trial":int("${{ matrix.trial }}"),
            "repeat":int("${{ matrix.repeat }}"),
            "family_version":int("${{ matrix.family_version }}"),
            "base_sha":os.environ.get("BASE_SHA"),
            "model":"${{ matrix.model }}",
            "effort":"${{ matrix.effort }}",
            "score":score["score"],
            "behavior_score":score["behavior_score"],
            "patch_quality_score":score.get("patch_quality_score"),
            "checks":score["checks"],
            "patch_metrics":runner.get("patch_metrics",{}),
            "unexpected_changed":score.get("unexpected_changed",[]),
            "duration_seconds":runner.get("duration_seconds",int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "max_turns":runner.get("max_turns"),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "turn_limit_reached":bool(runner.get("max_turns")) and runner.get("responses",0) >= runner.get("max_turns"),
            "shell_budget_reached":bool(runner.get("shell_budget")) and runner.get("shell_commands",0) >= runner.get("shell_budget"),
            "usage":runner.get("usage",{}),
            "api_timeout_ms":runner.get("api_timeout_ms"),
            "runner_telemetry_present":runner_present,
            "model_timeout":bool(runner.get("model_timeout")),
            "timeout_reason":runner.get("timeout_reason"),
            "infrastructure_error":infra,
            "outcome":outcome,
            "data_complete":runner_present and outcome in ("completed","model_timeout")
          }
          Path("result/result.json").write_text(json.dumps(row,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/light-agent-result.json")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.case_id }}-${{ matrix.effort }}-r${{ matrix.repeat }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    concurrency:
      group: real-repo-replay-results-publish
      cancel-in-progress: false
    needs: [prepare, eval]
    if: always() && needs.prepare.result == 'success' && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*-${{ github.run_id }}
          path: replay-results

      - name: Summarize replay family
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const rows=[];
          function walk(p){
            if(!fs.existsSync(p)) return;
            for(const e of fs.readdirSync(p,{withFileTypes:true})){
              const f=path.join(p,e.name);
              if(e.isDirectory()) walk(f);
              else if(e.name==='result.json') rows.push(JSON.parse(fs.readFileSync(f,'utf8')));
            }
          }
          walk('replay-results');
          rows.sort((a,b)=>String(a.effort).localeCompare(String(b.effort))||Number(a.trial)-Number(b.trial)||Number(a.repeat??1)-Number(b.repeat??1));
          const cfg=JSON.parse(fs.readFileSync('benchmarks/real-repo-replay/config.json','utf8'));
          const min=20,ceiling=95,hardLimit=600,target=300;
          const screen=cfg.mode==='screen'?{
            model:cfg.model,effort:cfg.efforts?.[0],family_version:cfg.family_version,
            decisions:(cfg.cases??[]).map(c=>{
              const r=rows.find(x=>x.case_id===c.id);
              const ok=Boolean(r && r.data_complete===true && r.outcome==='completed' && r.runner_telemetry_present!==false
                && !r.infrastructure_error && !r.model_timeout && !r.turn_limit_reached && !r.shell_budget_reached
                && Number(r.responses??0)>0 && Number(r.duration_seconds??Infinity)<=hardLimit);
              const score=r?Number(r.score):null;
              const decision=!ok?'invalid-or-budget-confounded'
                :score>=ceiling?'coverage-only-ceiling'
                :score>=min?'effort-calibration-candidate':'review-hard-or-invalid';
              return {case_id:c.id,score,seconds:r?.duration_seconds??null,
                outcome:r?.outcome??'missing',data_complete:ok,
                runtime_over_target:ok&&Number(r.duration_seconds)>target,
                decision};
            })
          }:null;
          const out={generated_at:new Date().toISOString(),mode:cfg.mode??'effort',
            family_version:cfg.family_version??1,trial_mode:'variants',rows,
            ...(screen?{screening:screen}:{})};
          fs.writeFileSync('replay-summary.json',JSON.stringify(out,null,2)+'\n');
          let md='# Real Repo Replay Family\n\n| Case | Effort | Replay quality | Behavior | Patch quality | Runtime | Outcome | Quality evidence | Changed files | Changed lines |\n|---|---|---:|---:|---:|---:|---|---|---:|---:|\n';
          for(const r of rows){
            const evidence=r.data_complete!==true?'incomplete'
              :(r.model_timeout||r.outcome==='model_timeout'||r.turn_limit_reached||r.shell_budget_reached
                ?'budget-confounded':'valid');
            md+=`| ${r.case_id} | ${r.effort} | ${r.score} | ${r.behavior_score} | ${r.patch_quality_score??'-'} | ${r.duration_seconds}s | ${r.outcome??'-'} | ${evidence} | ${r.patch_metrics?.changed_files??0} | ${r.patch_metrics?.changed_lines??0} |\n`;
          }
          md+='\n> Budget-confounded/incomplete rows are diagnostic only and must not establish an Effort Core quality gap.\n';
          if(screen){
            md+='\n## Luna High screening decisions\n\n| Case | Score | Seconds | Decision |\n|---|---:|---:|---|\n';
            for(const x of screen.decisions)
              md+=`| ${x.case_id} | ${x.score??'-'} | ${x.seconds??'-'} | ${x.decision}${x.runtime_over_target?' (over 300s target)':''} |\n`;
            md+='\n> Screening is not effort confirmation; Sol M/H/XH only follows valid non-ceiling signal.\n';
          }
          fs.writeFileSync('replay-summary.md',md);
          NODE
          node scripts/analyze-effort-efficiency.mjs             replay-summary.json             benchmarks/application-selection-policy.json             replay-analysis.json             replay-analysis.md
          cat replay-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf "\n\n" >> "$GITHUB_STEP_SUMMARY"
          cat replay-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: real-repo-replay-summary-${{ github.run_id }}
          path: |
            replay-summary.json
            replay-summary.md
            replay-analysis.json
            replay-analysis.md
          retention-days: 60

      - name: Publish replay evidence
        shell: bash
        run: |
          cp replay-summary.json /tmp/replay-summary.json
          cp replay-summary.md /tmp/replay-summary.md
          cp replay-analysis.json /tmp/replay-analysis.json
          cp replay-analysis.md /tmp/replay-analysis.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin real-repo-replay-results || true
          if git show-ref --verify --quiet refs/remotes/origin/real-repo-replay-results; then
            git switch -C real-repo-replay-results origin/real-repo-replay-results
          else
            git switch --orphan real-repo-replay-results
            git rm -rf --ignore-unmatch .
          fi
          mkdir -p replay/runs
          cp /tmp/replay-summary.json replay/latest.json
          cp /tmp/replay-summary.md replay/latest.md
          cp /tmp/replay-analysis.json replay/analysis-latest.json
          cp /tmp/replay-analysis.md replay/analysis-latest.md
          cp /tmp/replay-summary.json "replay/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/replay-analysis.json "replay/runs/${GITHUB_RUN_ID}-analysis.json"
          git add replay
          if ! git diff --cached --quiet; then
            git commit -m "Record real-repo replay family ${GITHUB_RUN_ID}"
            git push origin HEAD:real-repo-replay-results
          fi
