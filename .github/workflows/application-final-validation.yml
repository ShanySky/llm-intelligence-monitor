name: Final application benchmark validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "v1-core: 2 core tasks x 4 models High; full: original 5 tasks x 6 model/effort configs"
        type: choice
        required: true
        default: v1-core
        options:
          - v1-core
          - full
  push:
    branches:
      - main
    paths:
      - ".github/triggers/application-final.txt"

permissions:
  contents: read

concurrency:
  group: final-application-benchmark
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-app-final]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      profile: ${{ steps.matrix.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: No-cost V1 preflight
        run: |
          node --check scripts/light-agent-runner.mjs
          node --check scripts/summarize-application-results.mjs
          node --check scripts/check-application-v1.mjs
          node scripts/selfcheck-application-v1.mjs
      - id: matrix
        shell: bash
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const m=require('./benchmarks/application-final-suite.json');
          const profile=process.env.EVENT_NAME==='workflow_dispatch'
            ? (process.env.INPUT_PROFILE||'v1-core')
            : 'v1-core';
          if (!['v1-core','full'].includes(profile)) throw new Error('Unknown profile: '+profile);
          const tasks=profile==='full'
            ? m.families.map(x=>x.id)
            : m.families.filter(x=>x.role==='core').map(x=>x.id);
          const configs=profile==='full' ? [
            {key:'gpt-6-astra-xhigh',model:'gpt-6-astra',effort:'xhigh'},
            {key:'gpt-5-6-sol-xhigh',model:'gpt-5.6-sol',effort:'xhigh'},
            {key:'gpt-6-luna-xhigh',model:'gpt-6-luna',effort:'xhigh'},
            {key:'gpt-6-1-sol-medium',model:'gpt-6.1-sol',effort:'medium'},
            {key:'gpt-6-1-sol-high',model:'gpt-6.1-sol',effort:'high'},
            {key:'gpt-6-1-sol-xhigh',model:'gpt-6.1-sol',effort:'xhigh'},
          ] : [
            {key:'gpt-6-astra-high',model:'gpt-6-astra',effort:'high'},
            {key:'gpt-5-6-sol-high',model:'gpt-5.6-sol',effort:'high'},
            {key:'gpt-6-luna-high',model:'gpt-6-luna',effort:'high'},
            {key:'gpt-6-1-sol-high',model:'gpt-6.1-sol',effort:'high'},
          ];
          const include=tasks.flatMap(task=>configs.map(config=>({task,config})));
          console.log('profile='+profile);
          console.log('matrix='+JSON.stringify({include}));
          NODE

  eval:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BENCHMARK_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare isolated task
        shell: bash
        run: |
          TASK="${{ matrix.task }}"
          TASK_DIR="/tmp/final-$TASK-${{ matrix.config.key }}"
          rm -rf "$TASK_DIR"
          mkdir -p "$TASK_DIR"
          cp -R "benchmarks/$TASK/workspace/." "$TASK_DIR/"
          MAX_TURNS="$(node -e "const x=require('./benchmarks/application-final-suite.json');const f=x.families.find(v=>v.id===process.argv[1])||{};process.stdout.write(String(f.max_turns??40))" "$TASK")"
          SHELL_BUDGET="$(node -e "const x=require('./benchmarks/application-final-suite.json');const f=x.families.find(v=>v.id===process.argv[1])||{};process.stdout.write(String(f.shell_budget??40))" "$TASK")"
          VALIDATION_BUDGET="$(node -e "const x=require('./benchmarks/application-final-suite.json');const f=x.families.find(v=>v.id===process.argv[1])||{};process.stdout.write(String(f.validation_budget??8))" "$TASK")"
          PROBE_BUDGET="$(node -e "const x=require('./benchmarks/application-final-suite.json');const f=x.families.find(v=>v.id===process.argv[1])||{};process.stdout.write(String(f.probe_budget??20))" "$TASK")"
          echo "AGENT_MAX_TURNS=$MAX_TURNS" >> "$GITHUB_ENV"
          echo "AGENT_SHELL_BUDGET=$SHELL_BUDGET" >> "$GITHUB_ENV"
          echo "FINAL_VALIDATION_BUDGET=$VALIDATION_BUDGET" >> "$GITHUB_ENV"
          echo "FINAL_PROBE_BUDGET=$PROBE_BUDGET" >> "$GITHUB_ENV"
          [ ! -f "$TASK_DIR/ctl" ] || chmod +x "$TASK_DIR/ctl"
          if [ -f "$TASK_DIR/run_visible_tests.sh" ]; then
            chmod +x "$TASK_DIR/run_visible_tests.sh"
            (cd "$TASK_DIR" && ./run_visible_tests.sh)
          fi
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"

      - name: Run lightweight agent
        id: agent
        shell: bash
        run: |
          TASK="${{ matrix.task }}"
          VALIDATOR=""
          if [ -f "$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/benchmarks/$TASK/blackbox_validate.py"
          elif [ -f "$GITHUB_WORKSPACE/scripts/validators/$TASK.py" ]; then
            VALIDATOR="$GITHUB_WORKSPACE/scripts/validators/$TASK.py"
          fi
          if [ -n "$VALIDATOR" ]; then
            export AGENT_VALIDATION_COMMAND="python '$VALIDATOR' '$TASK_DIR'"
            export AGENT_VALIDATION_BUDGET="$FINAL_VALIDATION_BUDGET"
          fi
          PROBE="$GITHUB_WORKSPACE/scripts/probes/$TASK.py"
          if [ -f "$PROBE" ]; then
            export AGENT_PROBE_SCRIPT="$PROBE"
            export AGENT_PROBE_BUDGET="$FINAL_PROBE_BUDGET"
          fi
          start="$(date +%s)"
          set +e
          timeout 480s node scripts/light-agent-runner.mjs             "$TASK_DIR"             "${{ matrix.config.model }}"             "${{ matrix.config.effort }}"             "$TASK_DIR/light-agent-result.json"
          status=$?
          set -e
          end="$(date +%s)"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Score hidden checkpoints
        if: always()
        shell: bash
        run: |
          mkdir -p result
          python scripts/score-application-task.py             "${{ matrix.task }}"             "$TASK_DIR"             "$TASK_DIR/score.json"

          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          root=Path(os.environ["TASK_DIR"])
          score=json.loads((root/"score.json").read_text())
          rp=root/"light-agent-result.json"
          runner_present=rp.exists()
          runner=json.loads(rp.read_text()) if runner_present else {}
          exit_code=int("${{ steps.agent.outputs.exit_code || '999' }}")
          infra=runner.get("infrastructure_error")
          turn_limit=bool(runner.get("turn_limit_reached"))
          shell_limit=bool(runner.get("shell_budget_reached"))
          probe_limit=bool(runner.get("probe_enabled")) and runner.get("probe_calls",0)>=runner.get("probe_budget",999)
          if infra:
              outcome="infrastructure_error"
          elif runner_present and exit_code==124 and runner.get("model_timeout"):
              outcome="model_timeout"
          elif exit_code==124 and not runner_present:
              outcome="pre_telemetry_timeout"
          elif exit_code==0 and runner_present and not (turn_limit or shell_limit or probe_limit):
              outcome="completed"
          elif exit_code==0 and runner_present:
              outcome="budget_confounded"
          else:
              outcome="runner_error"

          result={
            "task":"${{ matrix.task }}",
            "model":"${{ matrix.config.model }}",
            "effort":"${{ matrix.config.effort }}",
            "score":score["score"],
            "checks":score["checks"],
            "duration_seconds":runner.get("duration_seconds", int("${{ steps.agent.outputs.wall_seconds || '480' }}")),
            "responses":runner.get("responses",0),
            "shell_commands":runner.get("shell_commands",0),
            "shell_budget":runner.get("shell_budget"),
            "turn_limit_reached":turn_limit,
            "shell_budget_reached":shell_limit,
            "probe_budget_reached":probe_limit,
            "model_timeout":bool(runner.get("model_timeout")),
            "timeout_reason":runner.get("timeout_reason"),
            "runner_telemetry_present":runner_present,
            "validation_calls":runner.get("validation_calls",0),
            "validation_budget":runner.get("validation_budget",0),
            "validation_enabled":runner.get("validation_enabled",False),
            "probe_calls":runner.get("probe_calls",0),
            "probe_attempts":runner.get("probe_attempts",0),
            "probe_budget":runner.get("probe_budget",0),
            "probe_enabled":runner.get("probe_enabled",False),
            "patch_metrics":runner.get("patch_metrics",{}),
            "usage":runner.get("usage",{}),
            "api_retries":runner.get("api_retries",0),
            "infrastructure_error":infra,
            "agent_exit_code":exit_code,
            "outcome":outcome,
            "data_complete":outcome=="completed"
          }
          Path("result/result.json").write_text(json.dumps(result,indent=2)+"\n")
          if rp.exists(): shutil.copy2(rp,"result/light-agent-result.json")
          for name in ["plan.json","REVIEW.md","REPORT.txt",".actions","FINDINGS.json"]:
              p=root/name
              if p.exists(): shutil.copy2(p,"result/"+name.replace("/","_"))
          if (root/"src").exists(): shutil.copytree(root/"src","result/final-src",dirs_exist_ok=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-final-${{ matrix.task }}-${{ matrix.config.key }}-${{ github.run_id }}
          path: result/
          retention-days: 30

  aggregate:
    needs: [prepare, eval]
    if: always() && needs.prepare.result == 'success' && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: app-final-*-${{ github.run_id }}
          path: results/application-final

      - name: Build selected application report
        shell: bash
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
        run: |
          node scripts/summarize-application-results.mjs \
            results/application-final \
            benchmarks/application-final-suite.json \
            results/application-final-summary.json \
            results/application-final-summary.md
          if [ "$PROFILE" = "v1-core" ]; then
            node scripts/check-application-v1.mjs \
              results/application-final-summary.json \
              results/application-v1-readiness.json \
              results/application-v1-readiness.md
            cat results/application-v1-readiness.md >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/analyze-application-discrimination.mjs \
              results/application-final-summary.json \
              benchmarks/application-selection-policy.json \
              results/application-discrimination.json \
              results/application-discrimination.md
            node scripts/check-application-maturity.mjs \
              results/application-final-summary.json \
              results/application-discrimination.json \
              benchmarks/frontier-registry.json \
              benchmarks/application-final-suite.json \
              results/application-maturity.json \
              results/application-maturity.md
            cat results/application-maturity.md >> "$GITHUB_STEP_SUMMARY"
            cat results/application-discrimination.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf "\\n\\n" >> "$GITHUB_STEP_SUMMARY"
          cat results/application-final-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ needs.prepare.outputs.profile }}-summary-${{ github.run_id }}
          path: |
            results/application-final-summary.json
            results/application-final-summary.md
            results/application-v1-readiness.json
            results/application-v1-readiness.md
            results/application-discrimination.json
            results/application-discrimination.md
            results/application-maturity.json
            results/application-maturity.md
          retention-days: 60

      - name: Publish versioned application results
        shell: bash
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/application-report
          cp results/application-final-summary.json /tmp/application-report/latest.json
          cp results/application-final-summary.md /tmp/application-report/latest.md
          if [ "$PROFILE" = "v1-core" ]; then
            cp results/application-v1-readiness.json /tmp/application-report/readiness-latest.json
            cp results/application-v1-readiness.md /tmp/application-report/readiness-latest.md
            BRANCH=application-v1-results
            PREFIX=application-v1
          else
            cp results/application-discrimination.json /tmp/application-report/discrimination-latest.json
            cp results/application-discrimination.md /tmp/application-report/discrimination-latest.md
            cp results/application-maturity.json /tmp/application-report/maturity-latest.json
            cp results/application-maturity.md /tmp/application-report/maturity-latest.md
            BRANCH=application-final-results
            PREFIX=application-final
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch --orphan "$BRANCH"
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p "$PREFIX/runs"
          cp /tmp/application-report/latest.json "$PREFIX/latest.json"
          cp /tmp/application-report/latest.md "$PREFIX/latest.md"
          cp /tmp/application-report/latest.json "$PREFIX/runs/${GITHUB_RUN_ID}.json"
          cp /tmp/application-report/latest.md "$PREFIX/runs/${GITHUB_RUN_ID}.md"
          if [ "$PROFILE" = "v1-core" ]; then
            cp /tmp/application-report/readiness-latest.json "$PREFIX/readiness-latest.json"
            cp /tmp/application-report/readiness-latest.md "$PREFIX/readiness-latest.md"
          else
            cp /tmp/application-report/discrimination-latest.json "$PREFIX/discrimination-latest.json"
            cp /tmp/application-report/discrimination-latest.md "$PREFIX/discrimination-latest.md"
            cp /tmp/application-report/maturity-latest.json "$PREFIX/maturity-latest.json"
            cp /tmp/application-report/maturity-latest.md "$PREFIX/maturity-latest.md"
            cp /tmp/application-report/discrimination-latest.json "$PREFIX/runs/${GITHUB_RUN_ID}-discrimination.json"
            cp /tmp/application-report/discrimination-latest.md "$PREFIX/runs/${GITHUB_RUN_ID}-discrimination.md"
          fi
          git add "$PREFIX"
          if ! git diff --cached --quiet; then
            git commit -m "Record $PROFILE application run ${GITHUB_RUN_ID}"
            git push origin "HEAD:$BRANCH"
          fi

          if [ "$PROFILE" = "v1-core" ] && node -e "process.exit(require('/tmp/application-report/readiness-latest.json').ready?0:1)"; then
            if ! gh release view "v0.1.0-beta.1" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "v0.1.0-beta.1" \
                -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "v0.1.0-beta.1 · Core 可用试用版" \
                --notes-file /tmp/application-report/readiness-latest.md
            fi
          fi
