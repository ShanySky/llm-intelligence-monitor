# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: GPT bilingual capability regression suite

prompts:
  - |-
    You are being evaluated for reasoning consistency and instruction following.
    Solve the task carefully.
    Return exactly the format requested by the task and nothing else.

    {{question}}

providers:
  - id: openai:responses:gpt-6-sol
    label: GPT-6 Sol High
    config:
      reasoning:
        effort: high
      max_output_tokens: 4096
      store: false

  - id: openai:responses:gpt-6-luna
    label: GPT-6 Luna High
    config:
      reasoning:
        effort: high
      max_output_tokens: 4096
      store: false

tests:
  - file://tests/core.yaml

sharing: false

evaluateOptions:
  cache: false
  maxConcurrency: 2
  timeoutMs: 300000
