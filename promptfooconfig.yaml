# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: GPT bilingual capability regression suite

# Keep the wrapper language-neutral so Chinese and English paired questions are
# compared without an extra English instruction prefix.
prompts:
  - "{{question}}"

providers:
  - id: openai:responses:gpt-6-sol
    label: GPT-6 Sol High
    config:
      reasoning:
        effort: high
      max_output_tokens: 4096
      store: false

  - id: openai:responses:gpt-6-luna
    label: GPT-6 Luna High
    config:
      reasoning:
        effort: high
      max_output_tokens: 4096
      store: false

tests:
  - file://tests/selected.yaml

sharing: false

evaluateOptions:
  cache: false
  maxConcurrency: 4
  timeoutMs: 300000
